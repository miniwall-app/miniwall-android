name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit has a Signed-off-by line
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for commit in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$commit" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "Missing Signed-off-by: $(git log -1 --format='%h %s' "$commit")"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Sign off with: git commit -s --amend (one commit) or git rebase --signoff main (several)."
          fi
          exit $missing
