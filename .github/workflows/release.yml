name: Release

# Builds the artifacts app.miniwall:sdk-core and app.miniwall:sdk (signed when a key is supplied) and adds them to the Maven repository served at
# https://maven.miniwall.app (a public Cloudflare R2 bucket) when a version tag is pushed. Published versions are never overwritten.
# Nothing is published until the repository variable PUBLISH_ENABLED is true. If the `publish` environment has required reviewers, the job also
# waits for them; without that environment, pushing the tag publishes at once.
# "Run workflow" (workflow_dispatch) is a dry run: the same build, signing and file checks, but nothing is read from or written to the bucket.
# Secrets (repository secrets): R2_ENDPOINT (https://<account id>.r2.cloudflarestorage.com),
# R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY (an R2 API token with object read and write on the bucket); optional SIGNING_KEY (armored PGP private
# key) and SIGNING_KEY_PASSWORD, to sign the artifacts.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: tag checks
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.g.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: g
        env:
          TAG: ${{ github.ref_name }}
          ENABLED: ${{ vars.PUBLISH_ENABLED }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::tag $TAG is not on main"; exit 1; }
          for f in core/build.gradle.kts sdk/build.gradle.kts; do
            v=$(sed -n 's/^version = "\(.*\)"/\1/p' "$f")
            [ "$v" = "$TAG" ] || { echo "::error::tag $TAG does not match $f ($v)"; exit 1; }
          done
          grep -q "const val VERSION = \"$TAG\"" sdk/src/main/kotlin/com/miniwall/sdk/Miniwall.kt || { echo "::error::Miniwall.VERSION is not $TAG (it is sent as X-Miniwall-SDK)"; exit 1; }
          grep -qE "^## ${TAG//./\\.}( |$)" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $TAG' section"; exit 1; }
          echo "enabled=${ENABLED:-false}" >> "$GITHUB_OUTPUT"

  publish:
    name: publish to maven.miniwall.app
    needs: guard
    if: always() && ((github.event_name == 'push' && needs.guard.outputs.enabled == 'true') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: publish
    env:
      BUCKET: miniwall-maven
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # R2 does not accept the extra checksums that newer AWS CLI versions add by default.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - name: version to publish (the tag; a dry run reads it from the build)
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then v="$GITHUB_REF_NAME"; else v=$(sed -n 's/^version = "\(.*\)"/\1/p' core/build.gradle.kts); fi
          echo "TAG=$v" >> "$GITHUB_ENV"
          echo "version $v ($GITHUB_EVENT_NAME)"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          # The runner's SDK manager no longer has the legacy `tools` package that the action installs by default.
          packages: ''
      - run: scripts/fetch-spec.sh
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:test --no-daemon
      - name: refuse to overwrite a published version
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          for a in sdk sdk-core; do
            if [ -n "$(aws s3 ls "s3://$BUCKET/app/miniwall/$a/$TAG/" --endpoint-url "$R2_ENDPOINT")" ]; then
              echo "::error::app.miniwall:$a:$TAG is already published; a version is never overwritten (publish the next version)"; exit 1
            fi
          done
      - name: start from what is already published (so maven-metadata.xml lists every version)
        if: github.event_name == 'push'
        run: aws s3 sync "s3://$BUCKET" build/maven-repo --endpoint-url "$R2_ENDPOINT" --no-progress
      - name: build and sign
        run: ./gradlew publishAllPublicationsToStagingRepository --no-daemon
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
      - name: check what will be uploaded
        run: |
          set -euo pipefail
          for a in sdk sdk-core; do
            d="build/maven-repo/app/miniwall/$a/$TAG"
            for f in "$a-$TAG.pom" "$a-$TAG.module"; do [ -f "$d/$f" ] || { echo "::error::missing $d/$f"; exit 1; }; done
            ls "$d"/"$a-$TAG".aar "$d"/"$a-$TAG".jar >/dev/null 2>&1 || { echo "::error::no $a-$TAG.aar or .jar"; exit 1; }
            grep -q "<version>$TAG</version>" "build/maven-repo/app/miniwall/$a/maven-metadata.xml" || { echo "::error::maven-metadata.xml of $a does not list $TAG"; exit 1; }
          done
      - name: list the repository that would be uploaded (dry run)
        if: github.event_name == 'workflow_dispatch'
        run: find build/maven-repo -type f | sort
      - name: upload
        if: github.event_name == 'push'
        run: aws s3 sync build/maven-repo "s3://$BUCKET" --endpoint-url "$R2_ENDPOINT" --no-progress

  github-release:
    name: GitHub release
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # A release created by hand from the tag already exists: that is fine, only create it when it does not.
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG already exists"; else gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes; fi
